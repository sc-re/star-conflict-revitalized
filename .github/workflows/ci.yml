name: CI

permissions:
  contents: write

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: loadbalancer
            asset_name: loadbalancer_linux.zip
          - os: macos-latest
            artifact_name: loadbalancer
            asset_name: loadbalancer_macos.zip
          - os: windows-latest
            artifact_name: loadbalancer.exe
            asset_name: loadbalancer_win.zip

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: go build -o out/${{ matrix.artifact_name }} starconflict/loadbalancer
      - run: cp loadbalancer/config.json out/
        if: github.ref == 'refs/heads/ci'
      - run: cp loadbalancer/cvars.json out/
        if: github.ref == 'refs/heads/ci'
      - uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: ${{ matrix.asset_name }}
          path: out/
        if: github.ref == 'refs/heads/ci'
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.asset_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: true
        if: github.ref == 'refs/heads/ci'
